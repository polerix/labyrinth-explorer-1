<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="titles">
            <img id="labyrinth-title" src="" alt="Labyrinth Title" class="title-image">
            <br>
            <img id="explorer-title" src="" alt="Explorer Title" class="title-image">
        </div>
        <div id="labyrinth"></div>
        <div id="controls">
            <div class="control-row">
                <button><img src="bluetile.png" alt="Blue Tile"></button>
                <button><img src="bluetile.png" alt="Blue Tile"></button>
                <button id="blow"><img src="blow.png" alt="Blow"></button>
                <button id="reset"><img src="reset.png" alt="Reset Game"></button>
                <button><img src="bluetile.png" alt="Blue Tile"></button>
                <button id="evil-eye"><img src="evil-eye-button.png" alt="Evil Eye Potion"></button>
                <button id="up"><img src="up.png" alt="Up"></button>
                <button><img src="bluetile.png" alt="Blue Tile"></button>
            </div>
            <div class="control-row">
                <button><img src="bluetile.png" alt="Blue Tile"></button>
                <button id="level"><img src="lvl1.png" alt="Level"></button>
                <button id="cancel-tnt"><img src="cancel-tnt.png" alt="Cancel TNT"></button>
                <button id="tnt"><img src="set-tnt.png" alt="Set TNT"></button>
                <button id="horus-eye"><img src="horus-eye-button.png" alt="Invisibility Potion"></button>
                <button id="left"><img src="left.png" alt="Left"></button>
                <button id="down"><img src="down.png" alt="Down"></button>
                <button id="right"><img src="right.png" alt="Right"></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
